#      BillingMode: PAY_PER_REQUEST
#      AttributeDefinitions:
#        - AttributeName: MessageId
#          AttributeType: S
#      KeySchema:
#        - AttributeName: MessageId
#          KeyType: HASH

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MessageTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource: arn:aws:dynamodb:us-west-2:884537046858:table/CS79C_TABLE

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  WebServer:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      Tags:
        - Key: Name
          Value: cs79c-web-server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y httpd python3 awscli
          sudo aws s3 cp s3://finalprojectv5-assetsbucket-s3mykwkr3d0o/web/index.html /var/www/html/index.html
          sudo aws s3 cp s3://finalprojectv5-assetsbucket-s3mykwkr3d0o/banner.jpg /var/www/html/banner.jpg
          sudo aws s3 cp s3://finalprojectv5-assetsbucket-s3mykwkr3d0o/web/post-message.py /var/www/cgi-bin/post-message.py
          sudo aws s3 cp s3://finalprojectv5-assetsbucket-s3mykwkr3d0o/web/messages.py /var/www/cgi-bin/messages.py
          sudo chmod +x /var/www/cgi-bin/*.py
          sudo echo "SetEnv CS79C_TABLE CS79C_TABLE" > /etc/httpd/conf.d/env.conf
          sudo echo "SetEnv AWS_DEFAULT_REGION us-west-2" >> /etc/httpd/conf.d/env.conf
          systemctl enable --now httpd
        #wget -O /var/www/html/banner.jpg https://${AssetsBucket}.s3.${AWS::Region}.amazonaws.com/banner.jpg
        #wget -O /var/www/html/index.html https://${AssetsBucket}.s3.${AWS::Region}.amazonaws.com/index.html
