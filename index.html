<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS79C - Scream into the void</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; background: #eef2f7; color: #172033; }
    .panel, .message { background: white; padding: 20px; margin-bottom: 16px; border-radius: 8px; }
    img { display: block; max-width: 100%; height: auto; margin: 0 auto 20px; }
    textarea { box-sizing: border-box; width: 100%; min-height: 120px; padding: 10px; }
    button { margin-top: 10px; padding: 10px 16px; }
    .message { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <img src="banner.jpg" alt="CS79C message board banner">
  <section class="panel">
    <h1>Anonymous Message Board</h1>
    <form action="/cgi-bin/post-message.py" method="post">
      <label for="message">Post a message</label>
      <textarea id="message" name="message" maxlength="1000" required></textarea>
      <br>
      <button type="submit">Post Message</button>
    </form>
  </section>
  <h2>Recent messages</h2>
  <div id="messages">Loading...</div>
  <script>
    async function loadMessages() {
      const container = document.getElementById("messages");
      try {
        const response = await fetch("/cgi-bin/messages.py", { cache: "no-store" });
        if (!response.ok) throw new Error("Unable to load messages.");
        const records = await response.json();
        container.replaceChildren();
        for (const record of records) {
          const box = document.createElement("div");
          const time = document.createElement("small");
          const text = document.createElement("div");
          box.className = "message";
          time.textContent = record.Timestamp;
          text.textContent = record.Message;
          box.append(time, document.createElement("br"), text);
          container.appendChild(box);
        }
        if (!records.length) container.textContent = "No messages yet.";
      } catch (error) {
        container.textContent = error.message;
      }
    }
    loadMessages();
  </script>
</body>
</html>
